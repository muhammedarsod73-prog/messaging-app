name: duo_chat
description: "A private 2-person text messaging WhatsApp clone built with Flutter & Supabase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  supabase_flutter: ^2.5.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  uuid: ^4.3.3
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.1.2
  flutter_background_service: ^5.0.5
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
