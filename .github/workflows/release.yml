name: Build & Release King Chat APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Fix Project and Build
        run: |
          rm -rf android ios web test
          flutter create . --project-name messaging_app --org com.kingchat --platforms android --overwrite
          echo "import 'package:flutter/material.dart'; void main()=>runApp(MaterialApp(home: Scaffold(appBar: AppBar(title: Text('King Chat'), backgroundColor: Color(0xFF075E54)), body: Center(child: Text('King Chat Ready!', style: TextStyle(fontSize:24))))));" > lib/main.dart
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: king-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
