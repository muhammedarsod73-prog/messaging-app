name: Build & Release King Chat APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Create Flutter Project Files
        run: |
          flutter create . --project-name messaging_app --org com.kingchat --platforms android
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: king-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
